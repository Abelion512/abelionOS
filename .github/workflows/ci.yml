name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      # `bun run test` = vitest (script proyek, memuat vitest.config.ts termasuk
      # environment jsdom + env uji); `bun test` memakai runner bawaan Bun.
      - run: bun run test
