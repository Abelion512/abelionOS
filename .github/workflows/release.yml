name: Release

# Pipeline rilis semantik (rekonstruksi dari kontrak terdokumentasi CHANGELOG
# v1.0.0): merge ke main → verifikasi → sisipkan entri CHANGELOG dari commit
# konvensional sejak tag terakhir → bump minor saat feat, patch saat
# fix/chore → tag v<version> → GitHub Release. Idempoten bila tag sudah ada.
# Tanpa action rilis pihak ketiga agar kebijakan data tetap dalam repo.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      # `bun run test` = Vitest (script proyek, memuat vitest.config.ts);
      # `bun test` memakai runner bawaan Bun dan membuat test komponen gagal.
      - run: bun run test

      - name: Hitung versi berikutnya dari commit konvensional
        id: semver
        run: |
          set -e
          LAST_TAG=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            RANGE="$LAST_TAG..HEAD"
          else
            RANGE="HEAD"
          fi
          FEATS=$(git log --no-merges --pretty=format:%s "$RANGE" | grep -cE '^feat(\(|:)' || true)
          FIXES=$(git log --no-merges --pretty=format:%s "$RANGE" | grep -cE '^(fix|perf|refactor|chore)(\(|:)' || true)
          CUR=$(bun --print 'require("./package.json").version')
          echo "Perkiraan: feat=$FEATS fix/chore=$FIXES dari versi $CUR"
          if [ "$FEATS" -gt 0 ]; then
            NEXT=$(bun --print 'const v=process.argv[1].split(".").map(Number); `${v[0]}.${v[1]+1}.0`' "$CUR")
          elif [ "$FIXES" -gt 0 ]; then
            NEXT=$(bun --print 'const v=process.argv[1].split(".").map(Number); `${v[0]}.${v[1]}.${v[2]+1}`' "$CUR")
          else
            echo "Tidak ada feat/fix sejak $LAST_TAG — release dilewati."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Sisipkan entri CHANGELOG
        if: steps.semver.outputs.skip != 'true'
        run: |
          set -e
          NEXT="${{ steps.semver.outputs.next }}"
          LAST_TAG=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then RANGE="$LAST_TAG..HEAD"; else RANGE="HEAD"; fi
          NOTES=$(git log --no-merges --pretty=format:"- %s" "$RANGE" | head -50)
          {
            echo ""
            echo "## [$NEXT] - $(date +%F)"
            echo ""
            echo "$NOTES"
          } >> /tmp/entry.md
          awk '{print} /^# Changelog$/ && !done {while ((getline line < "/tmp/entry.md") > 0) print line; close("/tmp/entry.md"); done=1}' CHANGELOG.md > /tmp/changelog.md
          mv /tmp/changelog.md CHANGELOG.md
          bun --print 'const p=require("./package.json"); p.version="'$NEXT'"; require("fs").writeFileSync("package.json", JSON.stringify(p,null,2)+"\n")'

      - name: Commit, tag, dan rilis
        if: steps.semver.outputs.skip != 'true'
        run: |
          set -e
          NEXT="${{ steps.semver.outputs.next }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json
          git commit -m "chore(release): v$NEXT [skip ci]" || echo "tidak ada perubahan"
          git tag "v$NEXT"
          git push origin HEAD --tags
          if gh release view "v$NEXT" >/dev/null 2>&1; then
            echo "Release v$NEXT sudah ada (idempoten)."
          else
            gh release create "v$NEXT" --title "v$NEXT" --notes-file <(sed -n "/## \[$NEXT\]/,/^\$/p" CHANGELOG.md)
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
